<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="A ginger cat playing an upright piano">
  <rect width="800" height="600" fill="#fdf6e3"/>
  <rect y="540" width="800" height="60" fill="#e7d9bd"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#c9b58c" stroke-width="3"/>

  <!-- upright piano -->
  <rect x="435" y="150" width="345" height="392" rx="8" fill="#1f2937"/>
  <rect x="458" y="172" width="299" height="140" rx="5" fill="#374151"/>
  <rect x="458" y="330" width="299" height="42" rx="5" fill="#374151"/>
  <!-- brass pedals -->
  <rect x="560" y="490" width="22" height="50" rx="4" fill="#d4af37"/>
  <rect x="600" y="490" width="22" height="50" rx="4" fill="#d4af37"/>

  <!-- sheet music on top -->
  <g>
    <rect x="520" y="96" width="150" height="62" rx="3" fill="#fffdf5" stroke="#c9b58c" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="532" y1="112" x2="658" y2="112"/>
      <line x1="532" y1="119" x2="658" y2="119"/>
      <line x1="532" y1="126" x2="658" y2="126"/>
      <line x1="532" y1="133" x2="658" y2="133"/>
      <line x1="532" y1="140" x2="658" y2="140"/>
    </g>
    <g fill="#1f2937">
      <ellipse cx="560" cy="132" rx="6" ry="4.5" transform="rotate(-20 560 132)"/>
      <line x1="565" y1="131" x2="565" y2="112" stroke="#1f2937" stroke-width="2"/>
      <ellipse cx="600" cy="124" rx="6" ry="4.5" transform="rotate(-20 600 124)"/>
      <line x1="605" y1="123" x2="605" y2="104" stroke="#1f2937" stroke-width="2"/>
      <ellipse cx="636" cy="138" rx="6" ry="4.5" transform="rotate(-20 636 138)"/>
      <line x1="641" y1="137" x2="641" y2="118" stroke="#1f2937" stroke-width="2"/>
    </g>
  </g>

  <!-- keyboard -->
  <rect x="445" y="385" width="320" height="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <g fill="#111827">
    <rect x="465" y="385" width="13" height="21" rx="2"/>
    <rect x="495" y="385" width="13" height="21" rx="2"/>
    <rect x="545" y="385" width="13" height="21" rx="2"/>
    <rect x="575" y="385" width="13" height="21" rx="2"/>
    <rect x="605" y="385" width="13" height="21" rx="2"/>
    <rect x="655" y="385" width="13" height="21" rx="2"/>
    <rect x="685" y="385" width="13" height="21" rx="2"/>
    <rect x="715" y="385" width="13" height="21" rx="2"/>
  </g>
  <rect x="435" y="417" width="340" height="20" rx="3" fill="#111827"/>

  <!-- bench -->
  <rect x="150" y="480" width="275" height="16" rx="5" fill="#a16207"/>
  <rect x="168" y="496" width="16" height="44" rx="3" fill="#8b5e34"/>
  <rect x="390" y="496" width="16" height="44" rx="3" fill="#8b5e34"/>

  <!-- floating music notes -->
  <g fill="#7c3aed" stroke="#7c3aed" stroke-width="3" stroke-linecap="round">
    <g transform="translate(215 200) rotate(-12)">
      <ellipse cx="0" cy="0" rx="10" ry="7.5" fill="#7c3aed" stroke="none"/>
      <line x1="9" y1="-2" x2="9" y2="-34"/>
      <path d="M 9 -34 q 18 6 16 22" fill="none"/>
    </g>
    <g transform="translate(300 150) rotate(8)">
      <ellipse cx="0" cy="0" rx="9" ry="7" fill="#7c3aed" stroke="none"/>
      <line x1="8" y1="-2" x2="8" y2="-32"/>
      <path d="M 8 -32 q 16 6 14 20" fill="none"/>
    </g>
    <g transform="translate(360 235) rotate(-6) scale(0.8)">
      <ellipse cx="0" cy="0" rx="10" ry="7.5" fill="#7c3aed" stroke="none"/>
      <line x1="9" y1="-2" x2="9" y2="-34"/>
      <path d="M 9 -34 q 18 6 16 22" fill="none"/>
    </g>
  </g>

  <!-- cat tail -->
  <path d="M 218 452 C 168 466 132 432 152 402 C 166 382 194 396 186 416"
        fill="none" stroke="#b45309" stroke-width="17" stroke-linecap="round"/>

  <!-- cat body -->
  <ellipse cx="282" cy="424" rx="86" ry="60" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <ellipse cx="300" cy="442" rx="50" ry="40" fill="#fbbf24"/>
  <g fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round">
    <path d="M 232 386 q 16 -10 32 -4"/>
    <path d="M 250 412 q 16 -10 32 -4"/>
    <path d="M 262 440 q 16 -10 32 -4"/>
  </g>
  <!-- hind paw -->
  <ellipse cx="332" cy="474" rx="24" ry="11" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>

  <!-- cat head -->
  <circle cx="354" cy="342" r="46" fill="#f59e0b" stroke="#92400e" stroke-width="3"/>
  <polygon points="322,308 314,266 356,296" fill="#f59e0b" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="376,296 400,264 398,312" fill="#f59e0b" stroke="#92400e" stroke-width="3" stroke-linejoin="round"/>
  <polygon points="327,304 322,278 348,298" fill="#fda4af"/>
  <polygon points="382,298 396,278 392,308" fill="#fda4af"/>
  <g fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round">
    <path d="M 334 312 q 14 6 26 0"/>
    <path d="M 358 314 q 14 6 24 -2"/>
  </g>
  <!-- face -->
  <path d="M 330 344 q 11 -13 22 0" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M 366 344 q 11 -13 22 0" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <polygon points="356,360 372,360 364,369" fill="#f472b6"/>
  <path d="M 364 369 q -6 8 -13 3" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <path d="M 364 369 q 6 8 13 3" fill="none" stroke="#92400e" stroke-width="3" stroke-linecap="round"/>
  <g stroke="#92400e" stroke-width="2" stroke-linecap="round">
    <line x1="344" y1="368" x2="306" y2="358"/>
    <line x1="344" y1="374" x2="304" y2="374"/>
    <line x1="386" y1="368" x2="418" y2="356"/>
    <line x1="386" y1="374" x2="420" y2="376"/>
  </g>

  <!-- front legs reaching to the keys -->
  <g stroke="#f59e0b" stroke-width="20" stroke-linecap="round" fill="none">
    <line x1="330" y1="410" x2="428" y2="396"/>
    <line x1="348" y1="428" x2="492" y2="410"/>
  </g>
  <ellipse cx="436" cy="397" rx="19" ry="12" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
  <ellipse cx="500" cy="411" rx="19" ry="12" fill="#fbbf24" stroke="#92400e" stroke-width="3"/>
  <g stroke="#92400e" stroke-width="2" stroke-linecap="round">
    <line x1="452" y1="397" x2="452" y2="404"/>
    <line x1="460" y1="397" x2="460" y2="404"/>
    <line x1="516" y1="411" x2="516" y2="418"/>
    <line x1="524" y1="411" x2="524" y2="418"/>
  </g>
</svg>
