<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <rect width="800" height="600" fill="#e0f2fe"/>
  <ellipse cx="400" cy="540" rx="350" ry="20" fill="#cbd5e1"/>
  <!-- Bicycle wheels -->
  <circle cx="250" cy="460" r="80" fill="none" stroke="#1e293b" stroke-width="10"/>
  <circle cx="250" cy="460" r="10" fill="#1e293b"/>
  <circle cx="550" cy="460" r="80" fill="none" stroke="#1e293b" stroke-width="10"/>
  <circle cx="550" cy="460" r="10" fill="#1e293b"/>
  <!-- Spokes -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="250" y1="380" x2="250" y2="540"/>
    <line x1="170" y1="460" x2="330" y2="460"/>
    <line x1="193" y1="403" x2="307" y2="517"/>
    <line x1="307" y1="403" x2="193" y2="517"/>
    <line x1="550" y1="380" x2="550" y2="540"/>
    <line x1="470" y1="460" x2="630" y2="460"/>
    <line x1="493" y1="403" x2="607" y2="517"/>
    <line x1="607" y1="403" x2="493" y2="517"/>
  </g>
  <!-- Frame -->
  <g stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="250" y1="460" x2="400" y2="360"/>
    <line x1="400" y1="360" x2="540" y2="360"/>
    <line x1="540" y1="360" x2="550" y2="460"/>
    <line x1="400" y1="360" x2="550" y2="460"/>
    <line x1="400" y1="360" x2="370" y2="300"/>
  </g>
  <!-- Handlebar -->
  <g stroke="#1e293b" stroke-width="6" stroke-linecap="round">
    <line x1="540" y1="360" x2="560" y2="320"/>
    <line x1="545" y1="320" x2="575" y2="320"/>
  </g>
  <!-- Seat -->
  <line x1="370" y1="300" x2="350" y2="290" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="340" cy="285" rx="25" ry="8" fill="#1e293b"/>
  <!-- Pedal crank -->
  <circle cx="420" cy="440" r="15" fill="none" stroke="#1e293b" stroke-width="5"/>
  <line x1="420" y1="440" x2="390" y2="470" stroke="#1e293b" stroke-width="5"/>
  <line x1="420" y1="440" x2="450" y2="410" stroke="#1e293b" stroke-width="5"/>

  <!-- Pelican body -->
  <ellipse cx="380" cy="250" rx="90" ry="70" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <!-- Tail -->
  <polygon points="295,230 240,210 250,250 235,260 295,270" fill="#e2e8f0" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
  <!-- Wing -->
  <ellipse cx="380" cy="260" rx="55" ry="35" fill="#e2e8f0" stroke="#334155" stroke-width="3" transform="rotate(-15 380 260)"/>
  <path d="M 340 260 Q 380 290 420 255" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <!-- Neck -->
  <path d="M 450 220 Q 470 150 490 130" fill="none" stroke="#f8fafc" stroke-width="28" stroke-linecap="round"/>
  <path d="M 450 220 Q 470 150 490 130" fill="none" stroke="#334155" stroke-width="32" stroke-linecap="round" opacity="0" />
  <!-- Head -->
  <circle cx="495" cy="120" r="35" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
  <!-- Eye -->
  <circle cx="505" cy="110" r="6" fill="#0f172a"/>
  <circle cx="507" cy="108" r="2" fill="white"/>
  <!-- Crest -->
  <path d="M 470 95 Q 460 70 475 60 Q 480 75 485 90 Z" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
  <!-- Big beak upper -->
  <path d="M 525 115 L 640 145 L 525 155 Z" fill="#fbbf24" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
  <!-- Pouch -->
  <path d="M 525 155 L 640 145 Q 600 200 530 185 Z" fill="#fb923c" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>
  <!-- Legs to pedals -->
  <g stroke="#fbbf24" stroke-width="12" stroke-linecap="round">
    <line x1="360" y1="315" x2="390" y2="470"/>
    <line x1="400" y1="315" x2="450" y2="410"/>
  </g>
  <!-- Feet -->
  <ellipse cx="390" cy="475" rx="15" ry="6" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
  <ellipse cx="452" cy="415" rx="15" ry="6" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
  <!-- Wing arm to handlebar -->
  <path d="M 410 240 Q 480 280 550 325" fill="none" stroke="#f8fafc" stroke-width="20" stroke-linecap="round"/>
  <path d="M 410 240 Q 480 280 550 325" fill="none" stroke="#334155" stroke-width="3" stroke-dasharray="0" opacity="0.2"/>
  <circle cx="555" cy="325" r="10" fill="#fbbf24" stroke="#334155" stroke-width="2"/>
</svg>
